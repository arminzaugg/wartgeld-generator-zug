# Temporary until the site itself moves to Bunny (hosting migration step 3):
# forward the address lookup to the Bunny edge service (edge/address-lookup/).
# Rollback: republish the previous release on Bunny (service only), or publish the
# previous Netlify deploy (whole site; its old bundle calls Supabase, so this works
# only while the Supabase project is still running). Never remove this rule alone:
# the app calls /api/address, so lookups would fail completely.
[[redirects]]
  from = "/api/address"
  to = "https://wartgeld-address-lookup.bunny.run/api/address"
  status = 200
  force = true

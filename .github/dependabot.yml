# Dependabot version updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Security updates for vulnerable dependencies are raised separately by
# Dependabot security alerts and are not delayed by the cooldown below.

version: 2
updates:
  # npm dependencies (package.json / package-lock.json in the repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a newly published version, so a hijacked
    # release that the registry pulls quickly never reaches us.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5

  # GitHub Actions used by .github/workflows — these are pinned to commit
  # SHAs, so Dependabot is what keeps the pins current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
